name: Release

# Push a tag like v1.0.0 to build the app and publish Celsius.zip on GitHub Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Package.swift needs Swift 6.2 (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          swift --version
          scripts/test.sh

      - name: Build the app
        run: scripts/build-app.sh

      - name: Set the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLIST=build/Celsius.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$PLIST"
          codesign --force --sign - --timestamp=none build/Celsius.app

      - name: Zip
        run: ditto -c -k --keepParent build/Celsius.app Celsius.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Celsius.zip --title "Celsius $GITHUB_REF_NAME" --generate-notes
